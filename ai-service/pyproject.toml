[project]
name = "antigravity-ai-service"
version = "0.1.0"
description = "FastAPI + LangChain + OpenAI/Claude AI microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "openai>=1.63.0",
    "anthropic>=0.45.0",
    "langchain>=0.3.18",
    "langchain-core>=0.3.35",
    "langchain-openai>=0.3.6",
    "langchain-anthropic>=0.3.7",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
