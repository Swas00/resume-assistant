name: Auto Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Backend to Railway
        uses: railway-app/action@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: backend
          environment: production

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Vercel
        uses: vercel/action@master
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          working-directory: ./frontend
          production: true

  deploy-ai-service:
    name: Deploy AI Service to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy AI Service to Railway
        uses: railway-app/action@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: ai-service
          environment: production

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-ai-service]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "✅ Deployment Complete!"
          echo "Frontend: https://resume-assistant.vercel.app"
          echo "Backend: Check Railway Dashboard"
          echo "AI Service: Check Railway Dashboard"
