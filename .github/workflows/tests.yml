name: Run Tests & Type Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-tests:
    name: Backend Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: ./backend
        run: npm run typecheck

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

  frontend-tests:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  ai-service-tests:
    name: AI Service Setup Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./ai-service
        run: pip install -r requirements.txt

      - name: Verify Python Imports
        working-directory: ./ai-service
        run: python -c "import fastapi; import spacy; import pydantic; print('✅ All dependencies OK')"

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ai-service-tests]
    if: always()
    steps:
      - name: Check Results
        run: |
          if [[ "${{ needs.backend-tests.result }}" == "success" && \
                "${{ needs.frontend-tests.result }}" == "success" && \
                "${{ needs.ai-service-tests.result }}" == "success" ]]; then
            echo "✅ All tests passed! Ready for deployment"
            exit 0
          else
            echo "❌ Some tests failed. Check logs above."
            exit 1
          fi
