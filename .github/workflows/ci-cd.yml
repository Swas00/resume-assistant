name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # =============================================================
  # Frontend CI: Lint, Typecheck & Build
  # =============================================================
  frontend-ci:
    name: Frontend CI (React 19 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Type check & Build
        run: npm run build

  # =============================================================
  # Backend CI: Lint, Typecheck & Compile
  # =============================================================
  backend-ci:
    name: Backend CI (Express + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Compile TypeScript
        run: npm run build

  # =============================================================
  # AI Service CI: Python Lint & Dependencies
  # =============================================================
  ai-service-ci:
    name: AI Service CI (FastAPI + Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        run: ruff check app/ || echo "Ruff check completed with notes"

      - name: Verify package imports
        run: |
          python -c "import app.main; print('FastAPI app imported successfully')"

  # =============================================================
  # Docker Build Verification
  # =============================================================
  docker-build:
    name: Docker Build Verification
    needs: [frontend-ci, backend-ci, ai-service-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: antigravity-backend:ci-test

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ai-service/Dockerfile
          push: false
          tags: antigravity-ai-service:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: antigravity-frontend:ci-test
