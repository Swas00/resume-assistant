version: '3.8'

services:
  # -------------------------------------------------------------
  # Database: MongoDB
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: antigravity-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-antigravity_db}
    volumes:
      - mongo_data:/data/db
    networks:
      - antigravity-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Express + TypeScript Backend API
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antigravity-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/antigravity_db
      JWT_SECRET: ${JWT_SECRET:-antigravity_jwt_development_secret_key_12345}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - antigravity-network

  # -------------------------------------------------------------
  # FastAPI + LangChain AI Service
  # -------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: antigravity-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-4o}
      ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-claude-3-5-sonnet-20241022}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:5000,*"
    networks:
      - antigravity-network

  # -------------------------------------------------------------
  # React 19 + Vite Frontend
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antigravity-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      VITE_BACKEND_URL: http://backend:5000
      VITE_AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - backend
      - ai-service
    networks:
      - antigravity-network

networks:
  antigravity-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
